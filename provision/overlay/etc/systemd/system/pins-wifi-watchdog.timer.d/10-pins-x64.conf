# Drop-in for the pins-wifi-watchdog.timer that ships with the pinsdaemon .deb
# (OnBootSec=60s, OnUnitActiveSec=10s, AccuracySec=5s).
#
# The shipped state of a PINS x64 appliance is "hotspot on" (wifi_config.json
# has desired_mode=hotspot), and the acceptance criterion is that the AP is
# there roughly a minute after power-on. Upstream waits 60 s after boot before
# the watchdog runs for the first time, which together with the AP setup itself
# lands past that.
#
# OnUnitActiveSec is restated deliberately. systemd.timer(5): assigning the
# EMPTY STRING to any of the monotonic options resets the WHOLE list of timers,
# not just the option being assigned. Without the line below the "OnBootSec="
# reset would also delete the periodic re-check and the watchdog would run
# exactly once per boot, which silently disables the entire Wi-Fi recovery
# path. Measured on a test VM: `systemctl show pins-wifi-watchdog.timer -p
# TimersMonotonic` then reported only { OnBootUSec=20s } and the service never
# ran a second time.
#
# 60 s (not upstream's 10 s) is the appliance cadence: the watchdog is only a
# backstop now. The AP is raised by the daemon's startup hook, the boot
# fallback is wifi-automanage - a 10-second tick produced ~18 journal lines
# per minute for no benefit. The AP-after-boot criterion only depends on
# OnBootSec=20s and is unaffected.
[Timer]
OnBootSec=
OnBootSec=20s
OnUnitActiveSec=60s
