# Give NINA a usable "My Documents" so the default image path is ABSOLUTE.
#
# .NET resolves Environment.SpecialFolder.MyDocuments on Linux from
# XDG_DOCUMENTS_DIR, and returns an EMPTY STRING when that is unset or points
# at a directory that does not exist (verified against .NET 10). NINA builds
# its default image path as Path.Combine(MyDocuments, "N.I.N.A"), so headless
# it ends up with the RELATIVE path "N.I.N.A" - resolved against the service's
# working directory, which is why frames landed in /opt/pins/N.I.N.A.
#
# The relative path is not merely untidy: after saving, ImageSaveController
# wraps it in `new Uri(path)`, which throws UriFormatException on a relative
# path and aborts the whole ImageSaved event. Every subscriber is skipped -
# no entry in the API's image history, no IMAGE-SAVE over the WebSocket. That
# is the "history stays empty" report from the field.
#
# The directory itself is created by the provisioning; without it .NET falls
# back to the empty string again.
[Service]
Environment=XDG_DOCUMENTS_DIR=/home/pins/Bilder
